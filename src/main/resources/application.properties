# 과제용 설정 (Oracle 21c XE 로컬 환경)
spring.datasource.url=${LAB_DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
spring.datasource.username=${LAB_DB_USER:C##SECURE}
spring.datasource.password=${LAB_DB_PASSWORD:SECURE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

assign.aes-key=${LAB_AES_KEY:}
logging.level.edu.secure.assign=INFO
